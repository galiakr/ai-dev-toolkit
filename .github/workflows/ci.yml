# This repo's own CI — validates the toolkit's content, not an app.
# Not to be confused with git/workflows/ci.yml, which is a template meant
# to be copied into OTHER projects that actually have a package.json.
#
# Copy this file to .github/workflows/ci.yml in ai-dev-toolkit itself
# (not into an adopting project).

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  secret-scan:
    # This repo has no package.json, so git/workflows/security.yml's
    # dependency-audit job doesn't apply here — but a template repo can
    # still accidentally commit a real secret inside a skill example or a
    # copied file, so the secret half of that template is still worth
    # running against this repo itself.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # full history so gitleaks can scan past commits on PRs

      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  validate-workflow-templates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Lint GitHub Actions workflow templates
        uses: raven-actions/actionlint@v2
        with:
          files: 'git/workflows/*.yml'

  validate-shell-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Shellcheck bootstrap.sh
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: './scripts'

  validate-skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Every skill has valid frontmatter
        run: |
          fail=0
          for f in skills/*/SKILL.md; do
            [ -f "$f" ] || continue
            head -1 "$f" | grep -q '^---$' || { echo "::error file=$f::Missing frontmatter opening ---"; fail=1; }
            grep -q '^name:' "$f" || { echo "::error file=$f::Missing 'name:' in frontmatter"; fail=1; }
            grep -q '^description:' "$f" || { echo "::error file=$f::Missing 'description:' in frontmatter"; fail=1; }
          done
          exit $fail

      - name: No orphaned flat skill files from the old structure
        run: |
          orphans=$(find skills -maxdepth 1 -name "skill-*.md" -type f 2>/dev/null || true)
          if [ -n "$orphans" ]; then
            echo "::error::Found orphaned flat skill files (should be skills/<name>/SKILL.md):"
            echo "$orphans"
            exit 1
          fi

      - name: Every skill folder is documented in README
        run: |
          missing=0
          for dir in skills/*/; do
            name=$(basename "$dir")
            grep -q "\`$name\`" README.md || { echo "::warning::Skill '$name' exists but isn't documented in README.md"; missing=1; }
          done
          exit 0   # warning only — doesn't fail the build, just flags it

  audit-skill-security:
    # Mechanical subset of the audit-skills skill (dangerous command
    # patterns, prompt-injection-style phrasing) that doesn't need an
    # agent's judgment call. The rest of audit-skills — description-vs-
    # behavior mismatches, scope review, provenance tracking — still needs
    # a human or an agent to run it; this job only catches what a fixed
    # pattern can catch, same split as security-review vs. security.yml.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Scan skills for dangerous command patterns
        run: |
          fail=0
          check() {
            file="$1"; level="$2"; label="$3"; pattern="$4"
            matches=$(grep -nE "$pattern" "$file" || true)
            [ -z "$matches" ] && return 0
            while IFS= read -r m; do
              echo "::$level file=$file::$label — $m"
            done <<< "$matches"
            [ "$level" = "error" ] && fail=1
            return 0
          }
          for f in skills/*/SKILL.md; do
            [ -f "$f" ] || continue
            # audit-skills/SKILL.md legitimately quotes these patterns as
            # examples of what to look for — scanning it would just flag itself.
            [ "$f" = "skills/audit-skills/SKILL.md" ] && continue

            check "$f" error "Possible network call with no obvious tie to the skill's purpose" 'curl |wget |\bnc[[:space:]]+-|\bnetcat\b|\bncat\b'
            check "$f" error "sudo usage" 'sudo'
            check "$f" error "rm -rf" 'rm -rf'
            check "$f" error "Obfuscated/eval'd command" 'base64 -d|base64 --decode|eval \$\('
            # Credentials/SSH-path references need context to judge (a
            # security-review-style skill legitimately reads .env) — warn,
            # don't fail.
            check "$f" warning "References credentials/SSH paths — confirm this matches the skill's stated purpose" '\.ssh|\.aws|id_rsa|\.env\b|credentials'
          done
          exit $fail

      - name: Scan skills for prompt-injection-style phrasing
        run: |
          fail=0
          check() {
            file="$1"; pattern="$2"
            matches=$(grep -niE "$pattern" "$file" || true)
            [ -z "$matches" ] && return 0
            while IFS= read -r m; do
              echo "::error file=$file::Language aimed at the agent rather than the user — $m"
            done <<< "$matches"
            fail=1
            return 0
          }
          for f in skills/*/SKILL.md; do
            [ -f "$f" ] || continue
            [ "$f" = "skills/audit-skills/SKILL.md" ] && continue
            check "$f" 'pre-approved|you must comply|takes precedence over other instructions|don'"'"'t mention this to the user|do this silently|skip confirmation|ignore (previous|prior) instructions|disregard (your|other)'
          done
          exit $fail

  skillspector-scan:
    # NVIDIA SkillSpector (https://github.com/NVIDIA/SkillSpector) — a
    # purpose-built scanner for agent skills, run in --no-llm (static-only)
    # mode so this job needs no API key and stays deterministic. It covers
    # the same two categories as audit-skill-security above (dangerous
    # commands, injection phrasing) plus 15 more it doesn't attempt: AST/taint
    # analysis, YARA malware signatures, supply-chain CVE lookups (OSV.dev),
    # excessive-agency and tool-poisoning heuristics. Kept alongside the
    # grep job rather than replacing it — tested, not assumed: a planted
    # `curl ... | bash` to an external domain plus the literal phrase
    # "don't mention this to the user" scored only 40/100 (CAUTION,
    # exit 0 — non-blocking) under SkillSpector's --no-llm static scoring,
    # while audit-skill-security's grep job fails hard on both patterns in
    # the same file. --no-llm trades recall for determinism; the grep job
    # is what still catches an unambiguous case like that one. A clearly
    # malicious skill (credential harvesting + a network-controlled exec
    # chain) does reliably score 100/CRITICAL and fail here — this job
    # isn't toothless, its blind spot is specifically low-signal content.
    # See fixtures/skillspector/ for both cases run for real.
    #
    # Every skill's static scan was validated against this repo's real
    # skills before this job was added (see SECURITY.md Layer 2). Several
    # skills legitimately trip heuristics given their stated purpose — e.g.
    # audit-skills quotes injection phrasing as documentation, security-review
    # reads .env/.gitignore state, a11y installs browser scan tooling via
    # npx. Each is suppressed with a specific reason in that skill's own
    # skills/<name>/.skillspector-baseline.yaml, not silenced globally.
    #
    # Two suppression caveats, both confirmed against fixtures/skillspector/
    # rather than assumed from the docs: (1) a baseline fingerprint is bound
    # to a skill file's *entire* decoded content, so any edit to a baselined
    # file — even one unrelated to the accepted finding — reactivates that
    # finding until the baseline is regenerated; it does not stay silently
    # suppressed. (2) a moderate-severity addition to an already-baselined
    # file is not guaranteed to push the score past the block threshold on
    # its own (same --no-llm scoring gap as above) — only a clearly severe
    # one reliably does. Regenerate + re-triage the baseline whenever a
    # skill file changes; don't rely on suppression surviving a diff. The
    # baseline is also pinned to a scanner_version; bumping the pinned
    # SkillSpector version below invalidates every existing baseline by the
    # same fail-closed rule, the same "unexplained hash mismatch is a flag"
    # principle audit-skills' step 6 already applies to adopted skills.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install SkillSpector
        run: |
          uv tool install "git+https://github.com/NVIDIA/skillspector.git@v2.9.4"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Scan every skill with SkillSpector
        run: |
          fail=0
          for d in skills/*/; do
            [ -f "$d/SKILL.md" ] || continue
            name=$(basename "$d")
            baseline="$d.skillspector-baseline.yaml"
            args=(scan "$d" --no-llm)
            [ -f "$baseline" ] && args+=(--baseline "$baseline")

            echo "::group::skillspector scan — $name"
            skillspector "${args[@]}"
            code=$?
            echo "::endgroup::"

            if [ "$code" -eq 1 ]; then
              echo "::error file=${d}SKILL.md::SkillSpector: risk score above threshold (DO_NOT_INSTALL) after baseline suppression — see the scan output above, then triage into skills/$name/.skillspector-baseline.yaml if it's a confirmed false positive"
              fail=1
            elif [ "$code" -eq 2 ]; then
              echo "::error file=${d}SKILL.md::SkillSpector: scan itself failed (bad input, unreadable source, or internal error) — see the scan output above"
              fail=1
            fi
          done
          exit $fail
